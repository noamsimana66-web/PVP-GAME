<style>

.pad button{height:clamp(44px,15vh,66px)}

@keyframes sl{from{opacity:0;transform:translateX(-30px) skewX(-12deg)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes rb{to{filter:hue-rotate(360deg)}}

.it{animation:sl .35s backwards;transition:background .15s,transform .15s}
.cd{animation:pop .3s backwards;transition:transform .15s,border-color .15s;position:relative}
.cd:active{transform:scale(.95)}
@media(hover:hover){.it:hover{background:rgba(20,48,30,.95);transform:translateX(8px) skewX(-12deg)}.cd:hover{transform:translateY(-3px);border-color:rgba(61,255,122,.6)}}
.cd.gold{border-color:rgba(242,177,52,.75)}

.srch{width:100%;font:inherit;font-weight:800;padding:10px 12px;margin-bottom:8px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#eafff0}.srch::placeholder{color:rgba(234,255,240,.45)}
.ms{background:rgba(8,20,13,.78);padding:10px 14px;margin-bottom:6px;font-weight:800;letter-spacing:.05em;font-size:13px;opacity:.8}.ms.ok{opacity:1;border-left:5px solid var(--g)}.ms small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:3px}.ms .bg{background:rgba(255,255,255,.15);margin-top:6px}.ms .bg i{display:block;height:6px;background:var(--g)}
.row.tr{opacity:.55}.row.tr.ok{opacity:1;background:rgba(61,255,122,.18);border-left:5px solid var(--g)}
.cd.r1{border-color:#4aa8ff}.cd.r2{border-color:#b45cff;background:rgba(80,30,120,.35)}.cd.r3{border-color:#ffb020;background:rgba(120,80,0,.35);box-shadow:0 0 10px rgba(255,176,32,.45)}.cd.r4{border-color:#fff;background:linear-gradient(135deg,rgba(255,215,0,.3),rgba(255,0,200,.25),rgba(0,229,255,.3))}
.cd.sel{outline:3px solid var(--g)}.cd .rt{font-weight:800;letter-spacing:.12em;font-size:10px;opacity:1;margin-top:2px}.srch option{color:#06210f;background:#fff}
.cd.god{border-color:#fff;background:linear-gradient(135deg,rgba(255,215,0,.3),rgba(255,0,200,.25),rgba(0,229,255,.3))}

.av{display:flex;width:44px;height:44px;border-radius:50%;margin:0 auto 6px;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:22px;color:#fff;text-shadow:0 2px 3px #000;border:3px solid rgba(255,255,255,.4)}
.mini{height:4px;background:rgba(255,255,255,.15);margin-top:5px}.mini i{display:block;height:100%;background:var(--g)}
@keyframes evg{50%{box-shadow:0 0 22px rgba(0,255,213,.95),0 0 36px rgba(180,0,255,.5)}}

.cd.fav{border-color:#ffd23f}

    [...SKN.keys()].sort((a,b)=>skw(b)-skw(a)).forEach(i=>{const x=SKN[i];if(!(fl2==='all'||(fl2==='open'?skA(x):fl2==='lock'?!skA(x):fl2==='r'+srar(x))))return;const a=skA(x),cl=x.col||c.col,b=el('button','cd'+(i===ps?' sel':'')+(a?'':' lk')+(FSV.has(x.n)?' fav':'')+' r'+srar(x),'<span class="dot" style="background:'+(a?cl:'#444')+';box-shadow:'+(a&&x.glow?'0 0 12px '+x.glow:'none')+'"></span>'+x.n+'<small>'+(a?'Outfit':skh(x))+'</small><small class="rt" style="color:'+RC[srar(x)]+'">'+RN[srar(x)]+'</small>');b.onclick=()=>{if(a){ps=i;render()}};g.appendChild(b)});
    P.appendChild(g);
  }else if(scr==='stages'){
    P.appendChild(head('STAGES'));const g=el('div','grid');
    [...STG,'Random'].forEach((n,i)=>{const lk=i>=20&&i<25&&!un('MAPS'),b=el('button','cd'+(i===stg?' sel':'')+(lk?' lk':''),lk?'???<small>Locked</small>':n);b.onclick=()=>{if(!lk){stg=i;render()}};g.appendChild(b)});
    P.appendChild(g);
  }else if(scr==='miss'){
    P.appendChild(head('MISSIONS'));P.appendChild(el('div','note',doneCount()+' / 90 COMPLETED · 40 SKINS + 50 FIGHTERS'));
    MS.map((m,j)=>j).sort((a,b)=>mdone(a)-mdone(b)||a-b).forEach(j=>{const m=MS[j],v=KS[m.c]||0,ok=v>=m.n,sk=RT(j),rw=sk?SKN.find(x=>x.mi===j):CH.find(x=>x.mi===j);
      P.appendChild(el('div','ms'+(ok?' ok':''),'<div>#'+(j+1)+' · '+m.t+'</div><small>REWARD · '+(sk?'SKIN ':'FIGHTER ')+rw.n.toUpperCase()+'</small><div class="bg"><i style="width:'+Math.min(100,v/m.n*100)+'%"></i></div><small>'+Math.min(v,m.n)+' / '+m.n+(ok?' ✓':'')+'</small>'))});
  }else if(scr==='road'){
    P.appendChild(head('TROPHY ROAD'));const T=tro();P.appendChild(el('div','note','TROPHIES · '+T+'  (+10 PER WIN)'));
    [...CH,...SKN].filter(x=>x.tr!=null).sort((a,b)=>a.tr-b.tr).forEach(x=>{const ok=avail(x);P.appendChild(el('div','row tr'+(ok?' ok':''),'<span>'+x.tr+' TROPHIES</span><span style="color:'+RC[x.look?rar(x):srar(x)]+'">'+(ok?'✓ ':'')+(x.look?'':'SKIN · ')+x.n+'</span>'))});
  }else if(scr==='event'){evScreen(P)
  }else if(scr==='codes'){
    P.appendChild(head('CODES'));
    const r=el('div','code','<input id="ci" placeholder="Secret code" maxlength="12" autocomplete="off" autocapitalize="characters"><button>APPLY</button>');
    const go=()=>{const v=$('ci').value.trim().toUpperCase();if(CODES[v]){unl.add(v);save('fgt',[...unl]);cmsg=CODES[v];if(v==='1358'){pc=CH.findIndex(x=>x.look==='admin');ps=SKN.findIndex(x=>x.adm)}
      if(v==='NOOB0'){pc=CH.findIndex(x=>x.look==='god');ps=SKN.findIndex(x=>x.glow==='rainbow')}}else cmsg='Invalid code';render()};
    r.lastChild.onclick=go;r.firstChild.addEventListener('keydown',ev=>{if(ev.key==='Enter')go()});
    P.appendChild(r);if(cmsg)P.appendChild(el('div','note',cmsg));
  }else{
    P.appendChild(head('STATISTICS'));const s=load('fgs',{w:0,l:0,rw:0,rl:0}),m=s.w+s.l;
    [['MATCHES WON',s.w],['MATCHES LOST',s.l],['WIN RATE',m?Math.round(s.w*100/m)+'%':'-'],['ROUNDS WON',s.rw],['TROPHIES',tro()],['TOTAL XP',xp],['LEVEL',1+Math.floor(xp/600)]].forEach(q=>P.appendChild(el('div','row','<span>'+q[0]+'</span><span>'+q[1]+'</span>')));
  }
}
/* ---------- input ---------- */
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();keys[k]=true;if(state!=='menu'&&['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))ev.preventDefault()});
addEventListener('keyup',ev=>{keys[ev.key.toLowerCase()]=false});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  const on=ev=>{ev.preventDefault();try{b.setPointerCapture(ev.pointerId)}catch(_){}touch[k]=true;b.classList.add('on')};
  const off=ev=>{ev.preventDefault();touch[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
  b.addEventListener('lostpointercapture',off);b.addEventListener('pointercancel',off);
  b.addEventListener('contextmenu',ev=>ev.preventDefault());
});
$('qb').onclick=toMenu;
render();
requestAnimationFrame(loop);
</script>
</body>
